    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6', 
                            600: '#0d9488',
                            900: '#134e4a',
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                        'fade-out': 'fadeOut 0.8s ease-in forwards',
                        'slow-pulse': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeOut: {
                            '0%': { opacity: '1' },
                            '100%': { opacity: '0' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Cursor blinking effect */
        .cursor-blink::after {
            content: '|';
            animation: blink 1s step-end infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        body { transition: background-color 0.3s, color 0.3s; }
        
        /* Ensure the main wrapper takes up full viewport height */
        .full-height-wrapper {
            min-height: 100vh;
            min-height: 100dvh; /* Fallback for modern mobile browsers */
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-slate-900 dark:text-gray-100 flex flex-col">

    <!-- Navigation Bar -->
    <nav class="fixed w-full z-50 top-0 left-0 border-b border-gray-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                
                <!-- Left: Project Name -->
                <a href="#" class="text-xl font-bold tracking-tight hover:text-brand-600 dark:hover:text-brand-500 transition-colors">
                    Genomic Benchmarks
                </a>

                <!-- Right: Controls -->
                <div class="flex items-center space-x-4">
                    
                    <!-- Theme Toggle Button -->
                    <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500" aria-label="Toggle Dark Mode">
                        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-gray-500" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    </button>

                    <!-- GitHub Link -->
                    <a href="https://github.com/genomic-benchmarks" target="_blank" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-gray-900 hover:bg-gray-700 dark:bg-white dark:text-gray-900 dark:hover:bg-gray-200 transition-all">
                        <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path>
                        </svg>
                        GitHub
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area (Landing Page Only) -->
    <main class="relative overflow-hidden pt-16">
        
        <!-- Decorative Background Elements -->
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-brand-500/20 rounded-full blur-3xl -z-10 animate-slow-pulse"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl -z-10 animate-slow-pulse" style="animation-delay: 2s;"></div>

        <!-- Hero Section -->
        <section class="flex items-center justify-center full-height-wrapper">
            <div class="text-center px-4 max-w-4xl mx-auto relative z-10">
                
                <!-- Title -->
                <h1 class="text-5xl md:text-7xl font-bold tracking-tight mb-4 animate-fade-in-up">
                    Genomic Benchmarks
                </h1>

                <!-- Container for Rotating Text -->
                <div id="rotator-container" class="h-12 md:h-16 flex items-center justify-center mb-6 animate-fade-in-up" style="animation-delay: 0.2s;">
                    <span class="text-xl md:text-3xl text-gray-500 dark:text-gray-400">
                        We provide 
                        <span id="rotator" class="text-brand-600 dark:text-brand-500 font-semibold cursor-blink"></span>
                    </span>
                </div>

                <!-- Subtitle (Hidden initially) -->
                <p id="subtitle" class="hidden text-lg md:text-xl text-gray-600 dark:text-gray-300 max-w-2xl mx-auto leading-relaxed">
                    Quality‑curated genomic benchmarks for fair and reproducible ML evaluation.
                </p>
            </div>
        </section>

    </main>

    <footer class="py-6 text-center text-sm text-gray-400 dark:text-gray-600 border-t border-gray-100 dark:border-slate-800">
        &copy; 2026 Genomic Benchmarks. All rights reserved.
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // --- 1. Typing Animation Logic ---
        const words = ["QC", "Datasets", "Leaderboard"];
        const rotatorElement = document.getElementById('rotator');
        const rotatorContainer = document.getElementById('rotator-container');
        const subtitleElement = document.getElementById('subtitle');
        
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let typeSpeed = 100;
        
        // Flag to track if we are done with the first full cycle
        let finishedCycle = false; 

        function type() {
            const currentWord = words[wordIndex];
            
            if (isDeleting) {
                rotatorElement.textContent = currentWord.substring(0, charIndex - 1);
                charIndex--;
                typeSpeed = 50; 
            } else {
                rotatorElement.textContent = currentWord.substring(0, charIndex + 1);
                charIndex++;
                typeSpeed = 150; 
            }

            // State management
            if (!isDeleting && charIndex === currentWord.length) {
                // Finished typing word
                isDeleting = true;
                typeSpeed = 2000; // Wait 2 seconds
                
                // If this is the last word of the list, mark that we are about to finish the cycle
                if(wordIndex === words.length - 1) {
                    finishedCycle = true;
                }
            } else if (isDeleting && charIndex === 0) {
                // Finished deleting
                isDeleting = false;
                
                // LOGIC TO STOP AFTER ONE CYCLE WITH FADE TRANSITION
                if (finishedCycle) {
                    // 1. Add fade-out animation class to container
                    rotatorContainer.classList.add('animate-fade-out');
                    
                    // 2. Wait for animation to finish (800ms matches CSS), then swap content
                    setTimeout(() => {
                        rotatorContainer.style.display = 'none'; // Remove from flow
                        
                        subtitleElement.classList.remove('hidden');
                        subtitleElement.classList.add('animate-fade-in-up');
                        
                    }, 800);
                    
                    // Stop the typing loop completely
                    return; 
                }

                wordIndex = (wordIndex + 1) % words.length;
                typeSpeed = 500; 
            }

            setTimeout(type, typeSpeed);
        }

        // Start animation one second after load
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(type, 1000); // Waits 1000ms (1 second) before starting
        });


        // --- 2. Theme Switcher Logic ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            lightIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            darkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');

            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });
    </script>
</body>
